services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guestbook-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATA_DIR=/var/lib/backend_data
      - DATA_FILE=/var/lib/backend_data/guestbook.json
    volumes:
      - guestbook-db-data:/var/lib/backend_data
    networks:
      - app-net

  frontend:
    image: nginx:alpine
    container_name: guestbook-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./design:/usr/share/nginx/html/design:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net

volumes:
  guestbook-db-data:
    name: guestbook-db-data

networks:
  app-net:
    name: app-net
    driver: bridge
